<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesajlar - İlayda Şenocak</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
  </head>
  <body class="messages-page">
    <a href="index.html" class="back-button">
      <i class="fas fa-arrow-left"></i>
      <span>Ana Sayfaya Dön</span>
    </a>

    <div class="messages-container">
      <h2>Mesajlar</h2>
      <div class="chat-messages"></div>
      <div class="chat-input">
        <input type="text" placeholder="Mesajınızı yazın..." />
        <button type="button">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <script>
      // Firebase yapılandırması
      const firebaseConfig = {
        apiKey: "AIzaSyCaZPKz_i9pKXSyy-eJqN7yjotaC8PZn2w",
        authDomain: "websayfam-6de23.firebaseapp.com",
        projectId: "websayfam-6de23",
        storageBucket: "websayfam-6de23.firebasestorage.app",
        messagingSenderId: "876673752245",
        appId: "1:876673752245:web:d8c4692cbc86df5b81b2fc",
        measurementId: "G-WQZXBQRWDN",
      };

      // Firebase'i başlat
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // Admin durumunu kontrol et ve ayarla
      function checkAdminStatus() {
        const isAdmin = localStorage.getItem("isAdmin") === "true";
        console.log("Admin durumu kontrol ediliyor:", isAdmin);
        return isAdmin;
      }

      // Mesajları gerçek zamanlı dinleme
      function listenToMessages() {
        const messagesDiv = document.querySelector(".chat-messages");
        if (!messagesDiv) {
          console.error("Mesajlar div'i bulunamadı");
          return;
        }

        // Önce mevcut mesajları temizle
        messagesDiv.innerHTML = "";

        db.collection("messages")
          .orderBy("timestamp", "asc")
          .onSnapshot(
            (snapshot) => {
              snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                  const message = change.doc.data();
                  console.log("Yeni mesaj alındı:", message);
                  const messageElement = createMessageElement(message);
                  messagesDiv.appendChild(messageElement);
                  messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
              });
            },
            (error) => {
              console.error("Mesajları dinleme hatası:", error);
            }
          );
      }

      // Mesaj elementi oluşturma
      function createMessageElement(message) {
        const div = document.createElement("div");
        // message.isAdmin değerini doğrudan kullan, checkAdminStatus() kullanma
        div.className = `message ${message.isAdmin ? "sent" : "received"}`;
        console.log(
          "Mesaj oluşturuluyor:",
          message.text,
          "Admin mi:",
          message.isAdmin
        );

        const content = document.createElement("div");
        content.className = "message-content";

        const p = document.createElement("p");
        p.textContent = message.text;

        const time = document.createElement("small");
        const messageDate = message.timestamp
          ? message.timestamp.toDate()
          : new Date();
        time.textContent = messageDate.toLocaleTimeString();

        content.appendChild(p);
        content.appendChild(time);
        div.appendChild(content);

        return div;
      }

      // Mesaj gönderme fonksiyonu
      async function sendMessage(text) {
        if (!text.trim()) return;

        const isAdmin = checkAdminStatus();
        console.log("Mesaj gönderiliyor, admin durumu:", isAdmin);

        try {
          const messageData = {
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            isAdmin: isAdmin,
          };

          console.log("Gönderilecek mesaj verisi:", messageData);

          await db.collection("messages").add(messageData);
          console.log("Mesaj başarıyla gönderildi");
          return true;
        } catch (error) {
          console.error("Mesaj gönderme hatası:", error);
          return false;
        }
      }

      // Sayfa yüklendiğinde
      document.addEventListener("DOMContentLoaded", function () {
        // Admin durumunu kontrol et
        const isAdmin = checkAdminStatus();
        console.log("Sayfa yüklendi, admin durumu:", isAdmin);

        if (!isAdmin) {
          console.log("Admin değil, mesaj gönderme devre dışı bırakılıyor");
          const chatInput = document.querySelector(".chat-input");
          if (chatInput) {
            chatInput.style.display = "none";
          }
        }

        // Mesaj gönderme olaylarını dinle
        const form = document.querySelector(".chat-input");
        const input = form?.querySelector("input");
        const button = form?.querySelector("button");

        if (form && input && button) {
          // Gönder butonu tıklama olayı
          button.onclick = () => {
            if (input.value.trim()) {
              sendMessage(input.value).then((success) => {
                if (success) {
                  input.value = "";
                  console.log("Mesaj gönderildi ve input temizlendi");
                }
              });
            }
          };

          // Enter tuşu olayı
          input.onkeypress = (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              if (input.value.trim()) {
                sendMessage(input.value).then((success) => {
                  if (success) {
                    input.value = "";
                    console.log("Mesaj gönderildi ve input temizlendi");
                  }
                });
              }
            }
          };
        }

        // Mesajları dinlemeye başla
        listenToMessages();
      });
    </script>
  </body>
</html>
